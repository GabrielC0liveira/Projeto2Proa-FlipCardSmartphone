<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Projeto2-Flipcard Smartphone</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="title">
        <h1>Flip card</h1>
    </div>
    <div class="container-cards">

<div class="flipcard">
        <div class="dentroflipcard">
            <div class="frenteflipcard">
                <img id="reflexo2" src="img/samreflexo.png" alt="">
            </div>
            <div class="backflipcardamarelo">
                <div class="headerback">
                    <img id="imagem2" src="img/samsemfundo.png">
                </div>
                <div class="rodapeback">
                    <h2>Samsung S23 Ultra</h2>
                    <p>Preto, 8Gb RAM, 256GB, 32MP</p>
                    <p class="preco">R$2.499,00</p>
                    <div>
                        <i class="fa fa-star"></i>
                        <i class="fa fa-star"></i>
                        <i class="fa fa-star"></i>
                        <i class="fa fa-star"></i>
                        <i class="fa fa-star-half-o"></i>
                    </div>
                    <a href="#">Desejos</a>
                    <a href="#">Carrinho</a>
                </div>
            </div>
        </div>
    </div>

    <div class="flipcard">
        <div class="dentroflipcard">
            <div class="frenteflipcard">
                <img id="reflexo" src="img/reflexoiphone.png" alt="">
            </div>
            <div class="backflipcard">
                <div class="headerback">
                    <img id="imagem" src="img/semfuncoimg.png">
                </div>
                <div class="rodapeback">
                    <h2>Iphone 16</h2>
                    <p>Prata, 8Gb RAM, 128GB, 48MP</p>
                    <p class="preco">R$4.499,00</p>
                    <div>
                        <i class="fa fa-star"></i>
                        <i class="fa fa-star"></i>
                        <i class="fa fa-star"></i>
                        <i class="fa fa-star"></i>
                        <i class="fa fa-star-half-o"></i>
                    </div>
                    <a href="#">Desejos</a>
                    <a href="#">Carrinho</a>
                </div>
            </div>
        </div>
    </div>

     <div class="flipcard">
        <div class="dentroflipcard">
            <div class="frenteflipcard">
                <img id="reflexo3" src="img/13reflexo.png" alt="">
            </div>
            <div class="backflipcardroxo">
                <div class="headerback">
                    <img id="imagem3" src="img/13semfundo.png">
                </div>
                <div class="rodapeback">
                    <h2>Iphone 13</h2>
                    <p>Azul, 6Gb RAM, 128GB, 32MP</p>
                    <p class="preco">R$2.799,00</p>
                    <div>
                        <i class="fa fa-star"></i>
                        <i class="fa fa-star"></i>
                        <i class="fa fa-star"></i>
                        <i class="fa fa-star"></i>
                        <i class="fa fa-star-o"></i>
                    </div>
                    <a href="#">Desejos</a>
                    <a href="#">Carrinho</a>
                </div>
            </div>
        </div>
    </div>

    </div>
</body>
</html>
